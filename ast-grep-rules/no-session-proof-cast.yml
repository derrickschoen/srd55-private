id: no-session-proof-cast
language: TypeScript
severity: error
message: >-
  A session persistence proof is minted, never cast (SAVE-COMPAT C3, supervisor D944): ReplayVerifiedRevisions comes
  only from replayVerifiedRevisions (a strict replay), JournalRecordedRevision only from the journal's own append.
  A cast would persist revisions no replay verified.
files:
  - src/**/*.ts
  - tools/**/*.ts
  - tests/**/*.ts
ignores:
  - src/vtt/session-persistence.ts
rule:
  pattern: $EXPRESSION as $TYPE
constraints:
  TYPE:
    regex: ^(?:ReplayVerifiedRevisions|JournalRecordedRevision)$
