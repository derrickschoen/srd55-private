id: no-trust-grant-cast
language: TypeScript
severity: error
message: >-
  A trust-recorded-history grant is minted only by tests/helpers/trust-recorded-history.ts (owner D941): casting to
  TrustRecordedHistoryGrant anywhere else forges one.
files:
  - src/**/*.ts
  - tools/**/*.ts
  - tests/**/*.ts
ignores:
  - tests/helpers/trust-recorded-history.ts
rule:
  pattern: $EXPRESSION as $TYPE
constraints:
  TYPE:
    regex: ^TrustRecordedHistoryGrant$
