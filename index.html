<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The licensor's wordmarks may not appear outside the attribution notice
         (docs/srd/ATTRIBUTION.md), so this shell carries none. -->
    <meta
      name="description"
      content="SRD-55 is a local-first character builder"
    />
    <meta name="theme-color" content="#7c3a20" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/app-icon.svg" type="image/svg+xml" />
    <title>SRD-55</title>
  </head>
  <body>
    <!-- Outside #app so it survives every screen render. It precedes the
         viewport-filling application shell so a held boot leaves both the
         warning and its action in the initial viewport. -->
    <section
      id="browser-support-notice"
      class="browser-support-notice"
      role="status"
      aria-live="assertive"
      aria-labelledby="browser-support-heading"
      data-browser-support-state="checking"
      hidden
    >
      <h2 id="browser-support-heading">Browser support warning</h2>
      <p id="browser-support-message"></p>
      <button id="browser-support-continue" type="button">
        Continue anyway
      </button>
    </section>
    <div id="app" aria-busy="true">
      <main class="loading-shell">
        <h1>SRD-55</h1>
        <output id="status" role="status">Starting local database…</output>
      </main>
    </div>
    <footer class="site-footer">
      <div class="pwa-status">
        <output
          id="persistence-status"
          role="status"
          aria-live="polite"
          data-persistence-state="requesting"
        >Requesting browser eviction protection…</output>
        <div id="update-ready" role="status" hidden>
          <span>Update ready.</span>
          <button id="refresh-update" type="button">Refresh to update</button>
        </div>
      </div>
      <a href="/legal" data-router-link>Licences and attribution</a>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
